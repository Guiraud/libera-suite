# The build, packaging and release tooling: the `lb` command. A workspace
# member of the repository's root project, and never part of the `libera` wheel.
#
# It depends on nothing outside the standard library and `libera` itself, on
# purpose: the builders run it with their own python3, outside any virtualenv,
# as `python3 -m libera_build` with build/src and src on PYTHONPATH. See
# notes/plans/build-tooling.md.
[project]
name = "libera-build"
version = "0.1.0"
description = "Build, check and release Libera Suite"
requires-python = ">=3.12"
dependencies = ["libera"]

[project.scripts]
lb = "libera_build.cli:main"

[tool.uv.sources]
libera = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libera_build"]

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/libera_build"
src_package = "libera_build"
units = ["*", "*.py"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

# Tiers, cheapest first. Add `expects = [...]` to a tier to scope it to
# the source units it should test (glob patterns over unit names); units
# outside the scope are reported n/a, not as gaps. Use it when layers map
# to tiers — e.g. integration `expects = ["repositories/*", "infra/*"]`,
# e2e `expects = ["web/*"]`. Omit it and the tier is checked against all.

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "e2e"
