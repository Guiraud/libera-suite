target-version = "py310"
preview = true

lint.select = [
    "ALL",
]

include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
    "build/**/*.py",
    "docs/*.py",
    "docs/figures/*.py",
]

lint.extend-ignore = [
    # Later (or never)
    "CPY", # Copyright
    "A",
    "ANN",
    "ERA",
    "FBT",
    "D",
    "DOC",

    # False positive (or not)
    "S101", # Use of `assert` detected
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "COM812", # ...
    "T201", # Print...
    "PERF401", # list comprehension - explicit append loop is clearer

    # Fix later (or not)
    # ...
]

[lint.extend-per-file-ignores]
# stubs/ names what pyobjc and Bottle name. NSMenuItem, callAfter and
# setAssociatedObject are Objective-C spellings, HTTPResponse is Bottle's, and a
# stub that renamed them would describe a module that does not exist.
"stubs/**/*.pyi" = [
    "N802", # callAfter -- pyobjc's name
    "N816", # setAssociatedObject -- likewise
    "N818", # HTTPResponse -- Bottle's exception, without the Error suffix
]
# The CLI imports the GUI in open_documents alone: pywebview and AppKit cost a third
# of a second, and no other command opens a window. `--convert` expands `*.docx`
# itself on Windows, where the shell does not, and the pattern is what the user
# typed, absolute or not, which Path.glob refuses.
"src/libera/cli/commands.py" = [
    "PLC0415", # libera.host.app, imported where a window is about to open
    "PTH207",  # glob.glob on a pattern typed on the command line
]
# payload.py runs allfontsgen out of the payload it just unpacked: that is the
# job, and the generated font index cannot be built anywhere but the target.
# convert.py shells out to x2t for every open and save: that is the host's job.
"src/libera/host/convert.py" = [
    "S404",    # subprocess import
    "S603",    # subprocess call -- argv form, no shell, binary from our own payload
    "PLC0415", # x2t is found through the session, which is bound per thread
]
# The two container-side checks. Neither is shipped and neither runs on a
# user's machine: they exist inside a build container, once, to prove that the
# thing just built actually does something.
#
# runtime-smoke.py starts the application inside the Flatpak sandbox and reads
# the page it serves.
"build/flatpak/runtime-smoke.py" = [
    "S404",  # subprocess import -- starting `flatpak run` is the job
    "S603",  # subprocess call -- argv form, no shell, a fixed executable
    "S607",  # flatpak comes from the image, by name
    "S310",  # urlopen -- the URL is the one our own loopback server printed
    "S108",  # /tmp/serve.log, in a --rm container with one process in it
]
# The e2e tier installs Playwright's browser the first time it needs one.
"tests/support/browsers.py" = [
    "S404",  # subprocess import
    "S603",  # subprocess call -- argv form, no shell, this interpreter's playwright
]
# gui-smoke.py opens a real window under Xvfb and screenshots it.
"build/test-linux/gui-smoke.py" = [
    "S404",   # subprocess import
    "S603",   # subprocess call -- argv form, no shell
    "S607",   # xwininfo and scrot come from the image, by name
    "PLC0415", # PIL is imported where it is used: only this path needs it
]
# manifest.py asks git which commit it stamps: the provenance a release
# records, which the AGPL asks for.
"src/libera/manifest.py" = [
    "S404", # subprocess import
    "S603", # subprocess call -- argv form, no shell
    "S607", # git, by name, like every other tool here
]
# desktop.py runs the system's own tools -- open, xdg-open, explorer -- and asks
# the OS who you are: Foundation on macOS, secur32/netapi32 on Windows, pwd
# elsewhere.
"src/libera/host/desktop.py" = [
    "S404",
    "S603",
    "S606",    # os.startfile is Windows' "open this with its handler", the job
    "S607",    # open, xdg-open and explorer come from the system, by name
    "PLC0415", # Foundation is macOS-only, pwd is Unix-only
    "TC003",   # pathlib is used at runtime, not only in annotations
]
# language.py asks the OS for the user's language and region: Foundation on
# macOS, kernel32 on Windows.
"src/libera/host/language.py" = [
    "PLC0415", # Foundation is macOS-only, windll Windows-only
]
# launcher.py runs update-desktop-database, which is the system's own tool and
# the only way the Open With menu learns about a new association.
"src/libera/launcher.py" = [
    "S404",  # subprocess import
    "S603",  # subprocess call -- argv form, no shell, a path from `which`
]
# macos_app.py builds a Libera.app: clang, otool, install_name_tool, codesign,
# iconutil and lsregister are the job, all from the system or the Command Line
# Tools. AppKit is imported where the icon is drawn, which is macOS alone, and
# the payload where x2t is asked its minimum macOS.
"src/libera/macos_app.py" = [
    "S404",    # subprocess import
    "S603",    # subprocess call -- argv form, no shell, the system's own tools
    "S607",    # otool, iconutil, codesign by name, from /usr/bin
    "PLC0415", # AppKit and the payload, imported where they are used
    "E501",    # one pyobjc selector longer than a line
]
# docs/ carries two generators for the site's images: shots.py drives the
# shipped CLI and a browser, figures/ builds diagrams with svg-plus. Tools, not
# shipped code, and each figure is run on its own rather than imported.
"docs/*.py" = [
    "INP001", # not a package
    "S404",   # subprocess import -- running `libera --serve` is the job
    "S603",   # subprocess call -- argv form, no shell
    "S310",   # urlopen on the loopback URL the subprocess just printed
    # The start window prints each recent document's directory, so the work
    # root is visible in a published screenshot, and macOS answers
    # tempfile.gettempdir() with /var/folders/s1/p081nm8s0fld.../T.
    "S108",   # a scratch directory under /tmp, on purpose
]
"docs/figures/*.py" = [
    "INP001", # a directory of scripts, each run on its own, sharing theme.py
]
# instance.py posts a second launch's documents to the first. The URL is built
# here from 127.0.0.1 and an integer port read back from our own state file:
# there is no scheme or host in it for anything else to choose.
"src/libera/host/instance.py" = ["S310"]
# urlopen on our own origin: https in production, file: in the tests.
"src/libera/host/updates.py" = ["S310"]
"src/libera/host/opening.py" = ["TC003"]
"src/libera/host/recents.py" = ["TC003"]
# session.py holds the registry and the thread binding, both module state by
# design: the session for a request is bound to the thread serving it.
"src/libera/host/session.py" = [
    "PLW0603",
    "TC003",
]
# server.py shells out to x2t for every open and save: that is the host's job.
# The server package, one reason per module now that they are separate.
"src/libera/host/server/api.py" = [
    # Refused reads as what happened -- `raise Refused(404)` -- and an Error
    # suffix would say less: it is a refusal, sent on purpose, not a fault.
    "N818",
]
"src/libera/host/server/start_window.py" = [
    # payload is imported where it is used: `libera --payload-install` has to
    # work before there is a payload to import anything out of.
    "PLC0415",
]
"src/libera/host/server/listener.py" = [
    # QuietHandler subclasses wsgiref's WSGIRequestHandler, and an override's
    # parameter *names* are part of its contract: the base class is free to
    # call them by keyword. log_message takes a `format` that shadows the
    # builtin, and arguments it ignores -- the standard library's spellings.
    "ARG002", # log_message(*args), required by the override and unused here
    "A002",   # log_message(format), named by the base class
]
# The payload package, one reason per module now that they are separate.
"src/libera/payload/generate.py" = [
    "S404",   # subprocess import -- running allfontsgen is the job
    "S603",   # subprocess call -- argv form, no shell, path from our own tree
]
"src/libera/payload/installer.py" = [
    "S310",   # urlopen -- the URL comes from our own manifest, https by default
    "S202",   # tarfile.extractall -- every member is checked by safe_extract first
]
# window.py imports pywebview and AppKit lazily: both are needed only when
# there is a window, and `libera payload install` has to work without one. Its
# save panel needs an Objective-C action target, whose selector name is part of
# the contract with AppKit.
"src/libera/host/app.py" = [
    "TC003",   # pathlib is used at runtime, not only in annotations
    # WindowedShell answers hooks.Shell, whose calls are methods whether or not a
    # given one needs the port.
    "PLR6301",
]
# HeadlessShell answers hooks.Shell by declining: its methods need neither `self`
# nor what they are asked with.
"src/libera/host/hooks.py" = [
    "ARG002",
    "PLR6301",
]
# The window package. pywebview and AppKit are imported where they are used in
# both halves: this module is read on every platform and they exist on one.
"src/libera/host/window/windows.py" = [
    "TC003",   # pathlib is used at runtime, not only in annotations
    "SLF001",  # webview.dom._dnd_state: the only place pywebview keeps dropped files' paths; test_drops checks its shape
]
# The three toolkit modules answer the same calls, and some have no use for an
# argument another needs: an AppKit alert is application-modal and has no
# parent, pywebview has no fullscreen state to set and no format list to show.
"src/libera/host/window/portable.py" = [
    "ARG001",  # see above
]
"src/libera/host/window/macos.py" = [
    "ARG001",  # see above
    "N802",    # formatChanged:, handleOpen:withReply: are Objective-C selectors
    "PLR6301", # AppKit calls these, not us
    "BLE001",  # run_on_gui_thread catches whatever the work raised on the GUI
               # thread, to raise it again on the thread that asked
    "SLF001",  # Window._initialize: make_window takes create_window's own
               # steps on the GUI thread, which pywebview has no call for
]
# PyGObject is a system package, so it can be missing wherever this module is
# merely imported -- the test tier, `--serve` on a headless box -- and only a
# question on screen needs it.
"src/libera/host/window/gtk.py" = [
    "PLC0415", # gi, where a dialog is built
    "BLE001",  # a dialog that fails on the GTK thread is raised again on the
               # thread that asked, as macos.py's run_on_gui_thread does
]
# The menu package picks its platform's bar in __init__, once, so nothing that
# uses the package tests the platform again.
"src/libera/host/menu/__init__.py" = [
    "RUF067", # `native` is chosen here: that choice is the package's surface
]
# menu/macos.py is Cocoa: selector names are the contract with AppKit, and a
# class full of one-line actions is not "complex" in the sense the rule means.
"src/libera/host/menu/macos.py" = [
    "N802",    # newDocument:, openRecent: and friends are selectors
    "C901",    # a class of one-line menu actions
    "PLR6301", # AppKit calls these, not us
    "E501",    # a selector plus its Objective-C call is sometimes long
]
# gui.py asks whether the GTK bindings are installed, which it can only do by
# trying to import them -- at module scope that import is the failure it is
# meant to report. It also asks the distribution's own python the same
# question, which is the only way to tell "PyGObject is not installed" apart
# from "PyGObject is installed and this virtualenv cannot see it" -- two
# failures needing opposite advice.
"src/libera/gui.py" = [
    "PLC0415",
    "S404",   # subprocess import
    "S603",   # subprocess call -- argv form, no shell, a fixed absolute path
]
# macos.py is Cocoa: the delegate's method names are Objective-C selectors and
# cannot be renamed, AppKit is imported lazily because this module is imported
# on every platform, and the captured document list is module state because the
# delegate is instantiated by the runtime and cannot be handed anything.
"src/libera/macos.py" = [
    "N802",    # applicationDidFinishLaunching_ and friends are selectors
    "PLC0415", # AppKit only exists on macOS
    "PLR6301", # delegate methods are called by AppKit, not by us
    "PLW0603", # the delegate has nowhere else to put what it caught
]
# build/ scripts are tools, not shipped code: they run system utilities and
# talk to Cocoa, and one pyobjc selector is simply longer than the line limit.
# The scripts only, by name: build/src is the libera_build package, a tested
# package held to src's rules, with its own entry below. (A `*` here crosses
# directories, so `build/*.py` would have taken it in too: measured.)
"build/{macos/*.py,test-linux/*.py,windows/*.py,flatpak/*.py}" = [
    "INP001", # not a package
    "S404",   # subprocess import -- running iconutil is the job
    "S603",   # subprocess call -- argv form, no shell
    "S607",   # iconutil comes from the system, by name, like every other tool
    "E501",   # initWithBitmapDataPlanes_pixelsWide_... is 170 characters long
    "N802",
    "PLC0415",
]
# The Windows installer's file associations. "{app}" in these strings is Inno
# Setup's constant for the install directory, written into an .iss file, not a
# Python placeholder that lost its f.
"build/windows/associations.py" = ["RUF027"]
# The frozen application's entry point opens its log for the life of the
# process: it becomes sys.stdout and sys.stderr, so there is no block to close
# it at the end of.
"build/windows/entry.py" = ["SIM115"]

#
# Tests
#
"{tests,build/tests}/**/*.py" = [
    "SLF001", # reaching into a module to check its wiring is the point
    "ARG001", # pytest matches hook parameters by name; they cannot be renamed
    "BLE001", #  blind-except
    "PLR2004",
    "INP001",
    "PLC0415", # runtime imports for optional dependencies
    "E501", # line too long in test assertions
    "N802", # naming
    "S310", # urlopen on a loopback URL the fixture just built is the point
]
# test_launcher.py runs desktop-file-validate over the entry it just wrote,
# because a faulty desktop file is ignored in silence and that tool is the only
# thing that says why. It comes from the Linux test image, by name, and the
# test skips where `which` does not find it.
"tests/a_unit/test_launcher.py" = [
    "S404", # subprocess import
    "S603", # subprocess call -- argv form, no shell
    "S607", # desktop-file-validate comes from the image, by name
]
# The build tooling runs scripts and git; so do its tests, as the builders do.
"build/src/libera_build/**/*.py" = [
    "S404", # subprocess import -- running build/'s scripts is the job
    "S603", # subprocess call -- argv form, no shell, scripts from this tree
    "S607", # sh, git, docker and podman, by name, like every script here
]
# The origin: urlopen on the CDN's own https URLs, and on PyPI's.
"build/src/libera_build/origin/*.py" = [
    "S310", # urlopen -- https, the origin this checkout publishes to, or PyPI
]
# Paths in scripts that run inside the test container, not on this machine.
"build/src/libera_build/linux.py" = [
    "S108", # /tmp/pycache, /tmp/sample.docx: the container's own /tmp
]
# A fake CDN for the origin's tests: http.server calls its handlers do_PUT,
# do_GET and do_HEAD, and they cannot be named otherwise.
"build/tests/b_integration/test_lb_origin_cdn.py" = [
    "N802", # do_PUT, do_GET, do_HEAD
]
"build/tests/**/*.py" = [
    "S404", # subprocess import
    "S603", # subprocess call -- lb, or sys.executable, argv form, no shell
    "S607", # git, by name, to make scratch repositories
]
# c_e2e runs the shipped CLI and a real browser as subprocesses, which is the
# whole point of an end-to-end test: argv form, no shell, fixed executables.
"tests/c_e2e/**/*.py" = [
    "S404", # subprocess import
    "S603", # subprocess call
]
# tests/d_gui starts the shipped CLI and lets it open real windows: the same
# argv-form subprocess call, for the one thing a browser cannot stand in for.
"tests/d_gui/**/*.py" = [
    "S404", # subprocess import
    "S603", # subprocess call
]
# test_gui_prereq.py runs this interpreter against a script gui.py generated,
# to check that the probe and the in-process check ask the same question. That
# is the comparison that was missing when the two disagreed, and it can only be
# made by running one of them somewhere else.
# test_manifest_stamp.py runs `python3 -m libera.manifest` the way dist.sh does.
"tests/b_integration/test_manifest_stamp.py" = [
    "S404", # subprocess import
    "S603", # sys.executable, argv form, no shell
]
# test_convert.py reads a PDF's text layer with pdftotext, since nothing in
# the payload or the standard library reads one.
"tests/b_integration/host/test_convert.py" = [
    "S404", # subprocess import
    "S603", # pdftotext found by shutil.which, argv form, no shell
]
# test_save_staging.py tags a document with /usr/bin/xattr, the way Finder
# would, since Python has no extended-attribute calls on macOS.
"tests/a_unit/host/test_save_staging.py" = [
    "S404", # subprocess import
    "S603", # /usr/bin/xattr, argv form, no shell
]
"tests/a_unit/test_gui_prereq.py" = [
    "S404", # subprocess import
    "S603", # sys.executable, argv form, no shell
]
# test_icon.py parses src/libera/icon.svg, which is a file in this repository
# and the same one three build steps read. defusedxml hardens a parser against
# hostile input; the input here is ours, and swapping the parser would change
# what the test measures -- it exists to reject what a *strict* parser rejects,
# because NSImage is one and librsvg is not.
"tests/a_unit/test_icon.py" = [
    "S314", # ElementTree.fromstring on our own committed artwork
    "S405", # the xml.etree import that goes with it
]
# test_attribution.py parses build/flatpak/*.metainfo.xml for the same reason:
# it is a file in this repository, checked so that the attribution it shows a
# software centre cannot drift from the one the application shows.
"tests/a_unit/test_attribution.py" = [
    "S314", # ElementTree.parse on our own committed metadata
    "S405", # the xml.etree import that goes with it
]

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["libera"]
